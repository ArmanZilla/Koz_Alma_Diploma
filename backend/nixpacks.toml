[phases.setup]
nixPkgs = ["python3", "gcc", "pkg-config", "libxcb", "xorg.libX11", "libGL"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt",
  ". /opt/venv/bin/activate && pip uninstall -y opencv-python || true",
  ". /opt/venv/bin/activate && pip install --no-cache-dir opencv-python-headless>=4.6.0"
]
